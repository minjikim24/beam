include "../common/akka.conf"                 #Akka(액터 시스템) 기본 설정을 불러옵니다.
include "../common/akka-router.conf"          #액터 라우팅 관련 공통 설정을 포함합니다.
include "../common/metrics.conf"              #메트릭(계측) 공통 설정을 포함합니다.
include "../common/matsim.conf"               #MATSim 관련 공통 설정을 포함합니다.

# This version, base-sf-light.conf, is configured to use a subsample of the population located in:
#  ${beam.inputDirectory}"/sample" : 이 설정이 inputDirectory 아래 sample 하위의 서브샘플을 쓰도록 설계됐다는 설명
##################################################################
# Agentsim
##################################################################
beam.agentsim.simulationName = "sf-light-1k-xml"                                  #출력 디렉터리 하위에 만들어질 시뮬 이름
beam.agentsim.agentSampleSizeAsFractionOfPopulation = 1.0                         #인구 샘플 사용 비율(1.0이면 샘플 파일의 전원을 사용)
beam.agentsim.firstIteration = 0
beam.agentsim.lastIteration = 5
beam.agentsim.thresholdForWalkingInMeters = 100                                   #100m 이하면 걷기로 간주하는 임계값
beam.agentsim.timeBinSize = 3600                                                  #통계 집계 시간 bin(초), 1시간 단위
beam.agentsim.endTime = "168:00:00"                                               #시뮬 종료 시각(168시간=7일)
beam.agentsim.schedulerParallelismWindow = 30                                     #스케줄러가 병렬 처리하는 시간 윈도우(초)

beam.router.skim.writeSkimsInterval = 1                                           #스킴(OD/시간대 비용표) 주기적 저장 비활성화
beam.router.skim.origin-destination-skimmer.writeFullSkimsInterval = 0            #풀 스킴 파일도 저장 안 함
beam.physsim.writeRouteHistoryInterval = 0                                        #물리시뮬 라우트 히스토리 저장 안 함

# MODE CHOICE OPTIONS:
# ModeChoiceMultinomialLogit ModeChoiceTransitIfAvailable ModeChoiceDriveIfAvailable ModeChoiceRideHailIfAvailable
# ModeChoiceUniformRandom
beam.agentsim.agents.modalBehaviors.modeChoiceClass = "ModeChoiceMultinomialLogit"                  #MNL(다항 로그릿) 기반 모드 선택
beam.agentsim.agents.modalBehaviors.defaultValueOfTime = 8.0                                        #기본 시간가치($/h 등) 8
beam.agentsim.agents.modalBehaviors.multinomialLogit.params.transfer = -1.4                         #환승 패널티(효용 감소)
beam.agentsim.agents.modalBehaviors.multinomialLogit.params.car_intercept = 0.0                     #각 모드 상수항(기본 선호도). RH 관련
beam.agentsim.agents.modalBehaviors.multinomialLogit.params.walk_transit_intercept = 0.0
beam.agentsim.agents.modalBehaviors.multinomialLogit.params.drive_transit_intercept = 0.0
beam.agentsim.agents.modalBehaviors.multinomialLogit.params.ride_hail_transit_intercept = 0.0
beam.agentsim.agents.modalBehaviors.multinomialLogit.params.ride_hail_intercept = 10.0              #RH 선호를 크게 올림
beam.agentsim.agents.modalBehaviors.multinomialLogit.params.ride_hail_pooled_intercept = -1.5       #풀드 RH는 다소 불리
beam.agentsim.agents.modalBehaviors.multinomialLogit.params.walk_intercept = 0.0
beam.agentsim.agents.modalBehaviors.multinomialLogit.params.bike_intercept = 0.0
beam.agentsim.agents.modalBehaviors.modeVotMultiplier.rideHailPooled = 2.0                          #풀드 RH의 시간가치 가중(2배 → 시간 손실 더 민감)
beam.agentsim.agents.parking.multinomialLogit.params.distance_multiplier = 1.0                      #주차 선택 효용에서 거리 가중
beam.agentsim.agents.parking.multinomialLogit.params.installed_capacity_multiplier = 0.001          #주차 용량(빈자릿수) 영향 가중(작게)
beam.agentsim.agents.parking.multinomialLogit.params.parking_costs_price_multiplier = 4.5           #주차요금 영향 가중(크게)
beam.agentsim.agents.modalBehaviors.lccm.filePath = ${beam.inputDirectory}"/lccm-long.csv"          #LCCM(차 보유/변화) 관련 파일 경로
beam.agentsim.agents.modeIncentive.filePath = ${beam.inputDirectory}"/incentives.csv"               #모드 인센티브 표
beam.agentsim.agents.ptFare.filePath = ${beam.inputDirectory}"/ptFares.csv"                         #대중교통 요금표
beam.agentsim.agents.plans {
  inputPlansFilePath = ${beam.inputDirectory}"/sample/1k/population.xml.gz"                         #인구속성 파일(1k 샘플)
  inputPersonAttributesFilePath = ${beam.inputDirectory}"/sample/1k/populationAttributes.xml.gz"
}
beam.agentsim.agents.households {
  inputFilePath = ${beam.inputDirectory}"/sample/1k/households.xml.gz"                               #가구속성 파일(1k 샘플)
  inputHouseholdAttributesFilePath = ${beam.inputDirectory}"/sample/1k/householdAttributes.xml.gz"
}
#BeamVehicles Params
beam.agentsim.agents.vehicles.linkToGradePercentFilePath = ${beam.inputDirectory}"/r5/linkToGradePercent.csv"  #링크별 경사도
beam.agentsim.agents.vehicles.fuelTypesFilePath = ${beam.inputDirectory}"/beamFuelTypes.csv"                   #연료타입 정의
beam.agentsim.agents.vehicles.vehicleTypesFilePath = ${beam.inputDirectory}"/vehicleTypes.csv"                 #차량 타입 정의
beam.agentsim.agents.vehicles.vehiclesFilePath = ${beam.inputDirectory}"/sample/1k/vehicles-50pct-ev.csv.gz"            #차량 인스턴스 정의(1k 샘플용)
beam.agentsim.agents.vehicles.sharedFleets = []                                        #공유차량 플릿 없음
#TAZ params
beam.agentsim.taz.filePath=${beam.inputDirectory}"/taz-centers.csv.gz"                 #TAZ 센터 파일
beam.agentsim.taz.parkingFilePath = ${beam.inputDirectory}"/taz-parking.csv.gz"        #TAZ 주차 리소스
#Toll params
beam.agentsim.toll.filePath=${beam.inputDirectory}"/toll-prices.csv"                   #톨 가격표
# Scaling and Tuning Params
beam.agentsim.tuning.transitCapacity = 0.5                                             #대중교통 수송능력 절반으로 스케일링
beam.agentsim.tuning.transitPrice = 1.0                                                #가격 스케일(1은 원값)
beam.agentsim.tuning.tollPrice = 1.0
beam.agentsim.tuning.rideHailPrice = 1.0
###########################
# Physsim
###########################
beam.physsim.inputNetworkFilePath = ${beam.inputDirectory}"/r5/physsim-network.xml"    #물리 시뮬 네트워크
beam.physsim.flowCapacityFactor = 0.01                                                 #링크 유량 용량을 1%로 축소(소규모 인구와 균형)
beam.physsim.storageCapacityFactor = 1.0                                               #저장 용량 스케일(링크 내 차량 수)
beam.physsim.writeEventsInterval = 1                                                   #물리시뮬 이벤트 매 iteration 기록
beam.physsim.writePlansInterval = 0                                                    #플랜은 기록 안 함
beam.physsim.linkStatsWriteInterval = 1                                                #링크통계 매 반복 기록, 1시간 bin
beam.physsim.linkStatsBinSize = 3600                                                   #1시간 bin
beam.physsim.ptSampleSize = 0.03                                                       #PT 시뮬 샘플링 비율(3%)
beam.physsim.jdeqsim.agentSimPhysSimInterfaceDebugger.enabled = false                  #JDEQSIM 관련 디버거/옵션 비활성
beam.physsim.skipPhysSim = false #물리시뮬 수행
beam.physsim.jdeqsim.cacc.enabled = false                                              #CACC(연결형 크루즈) 관련 비활성
beam.physsim.jdeqsim.cacc.minRoadCapacity = 2000
beam.physsim.jdeqsim.cacc.minSpeedMetersPerSec = 20
beam.physsim.jdeqsim.cacc.speedAdjustmentFactor = 1.0

###########################
# Replanning
###########################
beam.replanning{                       #재계획 모듈과 확률
  maxAgentPlanMemorySize = 6           #에이전트가 보관할 플랜 수
  Module_1 = "SelectExpBeta"
  ModuleProbability_1 = 0.7
  Module_2 = "ClearRoutes"
  ModuleProbability_2 = 0.1
  Module_3 = "ClearModes"
  ModuleProbability_3 = 0.1
  Module_4 = "TimeMutator"
  ModuleProbability_4 = 0.0
}

##################################################################
# Warm Mode
##################################################################
beam.warmStart.enabled = false                       #웜스타트 비활성(이전 run 결과 재사용 안 함)
#PATH TYPE OPTIONS: PARENT_RUN, ABSOLUTE_PATH
#PARENT_RUN: can be a director or zip archive of the output directory (e.g. like what get's stored on S3). We should also be able to specify a URL to an S3 output.
#ABSOLUTE_PATH: a directory that contains required warm stats files (e.g. linkstats and eventually a plans).
beam.warmStart.path = "https://s3.us-east-2.amazonaws.com/beam-outputs/run149-base__2018-06-27_20-28-26_2a2e2bd3.zip" #웜스타트용 경로(비활성이라 실제 사용 안 함)

##################################################################
# RideHail
##################################################################
beam.agentsim.agents.rideHail.iterationStats.timeBinSizeInSec=3600                                     #RH 통계 bin 1시간
# SurgePricing parameters
beam.agentsim.agents.rideHail.surgePricing.surgeLevelAdaptionStep=0.1                                  #단계 변화폭
beam.agentsim.agents.rideHail.surgePricing.minimumSurgeLevel=0.1                                       #최소 서지 레벨
# priceAdjustmentStrategy(KEEP_PRICE_LEVEL_FIXED_AT_ONE | CONTINUES_DEMAND_SUPPLY_MATCHING)
beam.agentsim.agents.rideHail.surgePricing.priceAdjustmentStrategy="KEEP_PRICE_LEVEL_FIXED_AT_ONE"     #가격 고정(=서지 비활성에 가까움)
beam.agentsim.agents.rideHail.managers = [                                                             #RH 매니저 설정
  {
    # Initialization Type(PROCEDURAL | FILE)
    initialization.initType = "PROCEDURAL"                                   #절차적으로 초기화
    # If PROCEDURAL, use these params
    # initialization.procedural.initialLocation.name(INITIAL_RIDE_HAIL_LOCATION_HOME | INITIAL_RIDE_HAIL_LOCATION_UNIFORM_RANDOM | INITIAL_RIDE_HAIL_LOCATION_ALL_AT_CENTER | INITIAL_RIDE_HAIL_LOCATION_ALL_IN_CORNER)
    initialization.procedural.initialLocation.name = "HOME"                  #가구 위치 근처에 배치
    initialization.procedural.initialLocation.home.radiusInMeters = 500
    initialization.procedural.vehicleTypeId = "Car"                          #RH 차량 타입
    # If FILE, use this param
    initialization.filePath = ${beam.inputDirectory}"/rideHailFleet.csv"     #파일 초기화시 경로(현재는 절차적이라 미사용)
    # Ride Hailing General Params
    defaultBaseCost = 1.8                                                    #기본/풀드 요금
    defaultCostPerMile = 0.91
    defaultCostPerMinute = 0.28
    pooledBaseCost = 1.89
    pooledCostPerMile = 1.11
    pooledCostPerMinute = 0.07
    rideHailManager.radiusInMeters = 10000                                   #디스패치 반경
    # allocationManager(DEFAULT_MANAGER | POOLING_ALONSO_MORA)
    allocationManager.name = "POOLING_ALONSO_MORA"                           #RH 풀링 알고리즘
    allocationManager.requestBufferTimeoutInSeconds = 200                    #매칭 대기 버퍼
    # repositioningManager can be DEFAULT_REPOSITIONING_MANAGER | DEMAND_FOLLOWING_REPOSITIONING_MANAGER | REPOSITIONING_LOW_WAITING_TIMES
    repositioningManager.name = "DEMAND_FOLLOWING_REPOSITIONING_MANAGER"     #수요추종 재배치
    repositioningManager.timeout = 300
    # DEMAND_FOLLOWING_REPOSITIONING_MANAGER
    repositioningManager.demandFollowingRepositioningManager.sensitivityOfRepositioningToDemand = 1   #수요 군집 파라미터
    repositioningManager.demandFollowingRepositioningManager.numberOfClustersForDemand = 30           #수요 군집 파라미터
    # REPOSITIONING_LOW_WAITING_TIMES
    allocationManager.repositionLowWaitingTimes.percentageOfVehiclesToReposition = 0.01               #낮은 대기시간 목표 재배치 옵션(메서드 TOP_SCORES, 스코어 가중/임계 등)
    allocationManager.repositionLowWaitingTimes.timeWindowSizeInSecForDecidingAboutRepositioning = 1200
    allocationManager.repositionLowWaitingTimes.allowIncreasingRadiusIfDemandInRadiusLow = true
    allocationManager.repositionLowWaitingTimes.minDemandPercentageInRadius = 0.1
    # repositioningMethod(TOP_SCORES | KMEANS)
    allocationManager.repositionLowWaitingTimes.repositioningMethod = "TOP_SCORES"
    allocationManager.repositionLowWaitingTimes.keepMaxTopNScores = 5
    allocationManager.repositionLowWaitingTimes.minScoreThresholdForRepositioning = 0.00001
    allocationManager.repositionLowWaitingTimes.distanceWeight = 0.01
    allocationManager.repositionLowWaitingTimes.waitingTimeWeight = 4.0
    allocationManager.repositionLowWaitingTimes.demandWeight = 4.0
    allocationManager.repositionLowWaitingTimes.produceDebugImages = true                             #디버그 이미지 생성
  }
]
##################################################################
# OUTPUTS
##################################################################
# The baseOutputDirectory is the base directory where outputs will be written. The beam.agentsim.simulationName param will
# be used as the name of a sub-directory beneath the baseOutputDirectory for simulation results.
# If addTimestampToOutputDirectory == true, a timestamp will be added, e.g. "beamville_2017-12-18_16-48-57"
beam.outputs.baseOutputDirectory = ${PWD}"/output/sf-light"                  #기본 출력 경로
beam.outputs.baseOutputDirectory = ${?BEAM_OUTPUT}                           #환경변수 BEAM_OUTPUT가 있으면 그것으로 덮어씀
beam.outputs.addTimestampToOutputDirectory = true                            #출력 폴더에 타임스탬프 추가

# To keep all logging params in one place, BEAM overrides MATSim params normally in the controller config module
beam.outputs.writePlansInterval = 1                 #컨트롤러 레벨 플랜 기록 주기(1 iteration마다)
beam.outputs.writeEventsInterval = 1                #이벤트 파일도 매 iteration 기록
beam.outputs.generalizedLinkStats.interval = 0      #일반화 링크 통계는 저장 안 함
# beam.outputs.writeSkimsInterval = 0               #스킴 저장 주기

# The remaining params customize how events are written to output files
beam.outputs.events.fileOutputFormats = "csv.gz,xml.gz" # valid options: xml(.gz) , csv(.gz), none - DEFAULT: csv.gz #이벤트 파일 포맷: CSV와 XML 둘 다

# Events Writing Logging Levels:
# Any event types not explicitly listed in overrideWritingLevels take on defaultWritingLevel
beam.outputs.events.eventsToWrite = "ActivityEndEvent,ActivityStartEvent,PersonEntersVehicleEvent,PersonLeavesVehicleEvent,ModeChoiceEvent,PathTraversalEvent,ReserveRideHailEvent,ReplanningEvent,RefuelSessionEvent,ChargingPlugInEvent,ChargingPlugOutEvent,ParkingEvent,LeavingParkingEvent"
# 이벤트 필터—여기 지정한 타입만 파일에 기록. (ChargingPlugIn/Out 포함)
beam.outputs.stats.binSize = 3600 #통계 bin 1시간

##################################################################
# Debugging
##################################################################

beam.debug {                                         #디버그 모드 끔, 모드선택 대안 기록도 끔
  debugEnabled = false
  vmInformation.createGCClassHistogram = false
  writeModeChoiceAlternatives = false
}

beam.debug.actor.logDepth = 0                        #액터 로그 콜스택 깊이 제한

beam.debug.stuckAgentDetection {                     #스턱 에이전트 탐지 설정(현재 enabled = false)
                                                     #아래 thresholds는 트리거별 메시지 수/타임아웃 기준(참고용)
checkIntervalMs = 200
checkMaxNumberOfMessagesEnabled = true
defaultTimeoutMs = 60000
enabled = false
overallSimulationTimeoutMs = 100000
thresholds = [
  {
    actorTypeToMaxNumberOfMessages {
      population = 1
      rideHailAgent = 1
      transitDriverAgent = 1
    }
    markAsStuckAfterMs = 20000
    triggerType = "beam.agentsim.agents.InitializeTrigger"
  },
  {
    actorTypeToMaxNumberOfMessages {
      population = 11
    }
    markAsStuckAfterMs = 20000
    triggerType = "beam.agentsim.agents.PersonAgent$ActivityEndTrigger"
  },
  {
    actorTypeToMaxNumberOfMessages {
      population = 1
    }
    markAsStuckAfterMs = 20000
    triggerType = "beam.agentsim.agents.PersonAgent$ActivityStartTrigger"
  },
  {
    actorTypeToMaxNumberOfMessages {
      population = 20
    }
    markAsStuckAfterMs = 20000
    triggerType = "beam.agentsim.agents.PersonAgent$PersonDepartureTrigger"
  },
  {
    actorTypeToMaxNumberOfMessages {
      population = 20
    }
    markAsStuckAfterMs = 20000
    triggerType = "beam.agentsim.agents.modalbehaviors.DrivesVehicle$AlightVehicleTrigger"
  },
  {
    actorTypeToMaxNumberOfMessages {
      population = 20
    }
    markAsStuckAfterMs = 20000
    triggerType = "beam.agentsim.agents.modalbehaviors.DrivesVehicle$BoardVehicleTrigger"
  },
  {
    actorTypeToMaxNumberOfMessages {
      population = 80,
      rideHailAgent = 104,
      transitDriverAgent = 114
    }
    markAsStuckAfterMs = 20000
    triggerType = "beam.agentsim.agents.modalbehaviors.DrivesVehicle$EndLegTrigger"
  },
  {
    actorTypeToMaxNumberOfMessages {
      population = 80,
      rideHailAgent = 104,
      transitDriverAgent = 114
    }
    markAsStuckAfterMs = 20000
    triggerType = "beam.agentsim.agents.modalbehaviors.DrivesVehicle$StartLegTrigger"
  },
  {
    actorTypeToMaxNumberOfMessages {
      transitDriverAgent = 1
    }
    markAsStuckAfterMs = 20000
    triggerType = "beam.agentsim.scheduler.BeamAgentScheduler$KillTrigger"
  }
]
}



##################################################################
# SPATIAL
##################################################################
beam.spatial = {
localCRS = "epsg:26910"  # what crs to use for distance calculations, must be in units of meters
boundingBoxBuffer = 10000 # meters of buffer around network for defining extend of spatial indices
}                                                                 #계산용 좌표계(미터 단위 UTM10N), 공간 인덱스 버퍼 10km

##################################################################
# BEAM ROUTING SERVICE
##################################################################
beam.routing {
  #Base local date in ISO 8061 YYYY-MM-DDTHH:MM:SS+HH:MM  #라우팅 전체 설정
  transitOnStreetNetwork = true                           #도로망에 PT-on-street 사용
  baseDate = "2019-04-01T00:00:00-07:00"                  #R5 기준 날짜/타임존
  r5 {
    directory = ${beam.inputDirectory}"/r5"               #R5 데이터 폴더
    # Departure window in min
    departureWindow = 1.0167                              #출발시간 창(분) ≈ 61초
    osmMapdbFile = ${beam.inputDirectory}"/r5/osm.mapdb"  #OSM 인덱스 DB
    mNetBuilder.fromCRS = "epsg:4326" # WGS84             #WGS84 → 로컬 CRS 변환
    mNetBuilder.toCRS = ${beam.spatial.localCRS}
  }
  gh.useAlternativeRoutes = false                         #GraphHopper 대안경로 사용 안 함
}

##################################################################
# Calibration
##################################################################
beam.calibration.objectiveFunction = "CountsObjectiveFunction"                                          #링크 카운트 적합 목적함수
beam.calibration.mode.benchmarkFilePath=${beam.inputDirectory}"/sf-light-calibration/benchmark.csv"     #모드 벤치마크 파일
beam.calibration.counts {                                                                               #카운트 스케일(샘플 대비 보정)
countsScaleFactor = 10.355
writeCountsInterval = 1
averageCountsOverIterations = 1
inputCountsFile = ${beam.inputDirectory}"/counts/fall_2015_wed_filtered.xml"                           #관측 카운트 파일
}

